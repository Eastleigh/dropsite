<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Required | SimplyPDF</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #6C63FF;
      --bg: #0A0A0F;
      --bg-card: #12121A;
      --text: #EEEEF0;
      --text-muted: #8888A0;
      --border: #2A2A3A;
      --danger: #EF4444;
      --radius: 16px;
      --radius-sm: 10px;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    .lock-icon {
      width: 56px; height: 56px;
      margin: 0 auto 20px;
      border-radius: 14px;
      background: rgba(108, 99, 255, 0.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 24px; }
    .error { color: var(--danger); font-size: 0.85rem; margin-bottom: 12px; }
    input {
      width: 100%; padding: 12px 16px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-family: inherit; font-size: 0.95rem;
      outline: none; margin-bottom: 16px;
    }
    input:focus { border-color: var(--primary); }
    button {
      width: 100%; padding: 12px;
      background: var(--primary); color: white; border: none;
      border-radius: var(--radius-sm); font-family: inherit;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #5A52E0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="lock-icon">🔒</div>
    <h1>This site is protected</h1>
    <p>Enter the password to view this content.</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/s/{{ slug }}/unlock">
      <input type="password" name="password" placeholder="Enter password" autofocus required>
      <button type="submit">Unlock</button>
    </form>
  </div>
</body>
</html>
